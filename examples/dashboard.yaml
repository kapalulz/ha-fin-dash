# Готовые карточки fin-dash для Home Assistant.
# Как вставить: Дашборд → ✎ → «+ Добавить карточку» → «Вручную» (Manual) → вставить ОДНУ карточку
# (блок, начинающийся с `- type:` без дефиса). Или целиком как вид: Raw configuration editor → views.
#
# Карточки 1–4 и 6–7 работают на стандартных карточках Home Assistant.
# Карточка 5 (красивые полоски) — custom:bar-card из HACS: HACS → Frontend → «bar-card».

title: Финансы
views:
  - title: Финансы
    path: finance
    icon: mdi:cash
    cards:
      # 1. Свободно — главное число
      - type: tile
        entity: sensor.fin_dash_free
        name: Свободно
        icon: mdi:cash-check
        color: green
        vertical: true

      # 2. Сегодня можно потратить
      - type: tile
        entity: sensor.fin_dash_can_spend_today
        name: Сегодня можно
        icon: mdi:calendar-today
        color: blue
        vertical: true

      # 3. Карманные: шкала 0–100%+ (сравнивайте с «Прошло месяца»)
      - type: gauge
        entity: sensor.fin_dash_pocket_pct
        name: Карманные
        min: 0
        max: 120
        needle: true
        severity:
          green: 0
          yellow: 80
          red: 100

      # 4. Все полоски лимитов — стандартные шкалы (без дополнений)
      - type: grid
        title: Лимиты на месяц
        columns: 3
        square: false
        cards:
          - type: gauge
            entity: sensor.fin_dash_limit_food
            name: Продукты
            min: 0
            max: 120
            needle: true
            severity: { green: 0, yellow: 80, red: 100 }
          - type: gauge
            entity: sensor.fin_dash_limit_eating_out
            name: Кафе
            min: 0
            max: 120
            needle: true
            severity: { green: 0, yellow: 80, red: 100 }
          - type: gauge
            entity: sensor.fin_dash_limit_shopping
            name: Шопинг
            min: 0
            max: 120
            needle: true
            severity: { green: 0, yellow: 80, red: 100 }
          - type: gauge
            entity: sensor.fin_dash_limit_home
            name: Дом
            min: 0
            max: 120
            needle: true
            severity: { green: 0, yellow: 80, red: 100 }
          - type: gauge
            entity: sensor.fin_dash_limit_car
            name: Машина
            min: 0
            max: 120
            needle: true
            severity: { green: 0, yellow: 80, red: 100 }
          - type: gauge
            entity: sensor.fin_dash_limit_fun
            name: Развлечения
            min: 0
            max: 120
            needle: true
            severity: { green: 0, yellow: 80, red: 100 }

      # 5. Те же лимиты горизонтальными полосками (нужен bar-card из HACS → Frontend)
      - type: custom:bar-card
        title: Лимиты на месяц
        min: 0
        max: 100
        height: 28px
        positions: { icon: outside, indicator: inside, name: inside, value: inside }
        severity:
          - { from: 0, to: 79.9, color: '#1baf7a' }
          - { from: 80, to: 99.9, color: '#eda100' }
          - { from: 100, to: 100000, color: '#d03b3b' }
        entities:
          - { entity: sensor.fin_dash_limit_food, name: Продукты }
          - { entity: sensor.fin_dash_limit_eating_out, name: Кафе и рестораны }
          - { entity: sensor.fin_dash_limit_shopping, name: Шопинг }
          - { entity: sensor.fin_dash_limit_home, name: Дом }
          - { entity: sensor.fin_dash_limit_car, name: Машина и транспорт }
          - { entity: sensor.fin_dash_limit_fun, name: Развлечения }
          - { entity: sensor.fin_dash_month_elapsed, name: Прошло месяца, icon: mdi:calendar-month }

      # 6. Прогноз и платежи
      - type: entities
        title: Прогноз на 30 дней
        entities:
          - entity: sensor.fin_dash_forecast_min
            name: Минимум на счетах
          - type: attribute
            entity: sensor.fin_dash_forecast_min
            attribute: min_date
            name: Когда
          - entity: sensor.fin_dash_next_income_date
            name: Зарплата
          - entity: sensor.fin_dash_next_payment
            name: Ближайший платёж
          - type: attribute
            entity: sensor.fin_dash_next_payment
            attribute: what
            name: Что
          - entity: binary_sensor.fin_dash_forecast_low
            name: Уйдёт в минус

      # 7. Игра: герой, задания, дракон ипотеки
      - type: markdown
        title: Летопись героя
        content: >-
          {% set lvl = 'sensor.fin_dash_level' %}
          **{{ state_attr(lvl, 'title') }}** · уровень {{ states(lvl) }}
          · опыт {{ state_attr(lvl, 'level_pct') | round(0) }}% до следующего

          🔥 Серия {{ states('sensor.fin_dash_streak') | int(0) }} дн.
          (рекорд {{ state_attr('sensor.fin_dash_streak', 'best') }})
          · 🪙 копилка {{ states('sensor.fin_dash_piggy') | float(0) | round(0) }}
          · 🏆 {{ states('sensor.fin_dash_achievements') }}
          из {{ state_attr('sensor.fin_dash_achievements', 'total') }}

          **Задания на сегодня**
          {% for q in state_attr('sensor.fin_dash_quests_done', 'quests') or [] %}
          {{ '✅' if q.done else '⬜' }} {{ q.name }} · +{{ q.xp }} опыта
          {% endfor %}
          {% if states('sensor.fin_dash_dragon_hp') not in ['unknown', 'unavailable'] %}

          🐉 Дракон ипотеки: {{ states('sensor.fin_dash_dragon_hp') }}% HP
          ({{ state_attr('sensor.fin_dash_dragon_hp', 'hp') }}
          из {{ state_attr('sensor.fin_dash_dragon_hp', 'max_hp') }})
          {% endif %}
